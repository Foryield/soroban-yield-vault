name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  wasm-build:
    name: Wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target wasm32v1-none --release

  onboarding-tests:
    name: Onboarding tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onboarding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: onboarding/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Static export (`output: "export"`): builds with no environment at all,
      # exercising the public testnet defaults of lib/stellar.ts. `.env.local`
      # is gitignored, so CI is the only place this bare path is checked.
      - run: npm run build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # 90% line-coverage gate, active since the Deliverable 1 test campaign
      # (234 tests: unit, Blend integration, generated matrix, proptest, plus
      # the targeted mock_auths tests on the admin pause switch).
      #
      # Test modules are excluded from the measure. Soroban keeps tests in
      # `src/` (`#[cfg(test)] mod test`), so without this filter llvm-cov
      # counts the test files themselves: 2,583 lines of generated matrix at
      # 100% drown the production code and the gate stops biting (99.07%
      # measured whole vs 94.89% on production code alone, 2026-07-27).
      - run: >
          cargo llvm-cov --workspace --summary-only
          --ignore-filename-regex '(^|/)test[^/]*\.rs$'
          --fail-under-lines 90
