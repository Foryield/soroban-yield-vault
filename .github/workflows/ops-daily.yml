name: Ops daily

# Tache quotidienne de l'allocateur D5 testnet (plan
# docs/plans/2026-10-23-d6c-dashboard.md, section 4), dans cet ordre :
#   1. checkpoint() : event `nav` du jour (D6a, section 8, reponse 4) ;
#   2. prix de reference de la strategie Aquarius au taux BCE du jour : sans
#      publication, il perime au bout de 72 h et gele tout le vault ;
#   3. ingestion des events vers la branche `data/events`, que lit le
#      dashboard : le RPC ne les garde qu'environ 7 jours.
#
# Signe avec la cle `fy-ops-bot` (secret FY_OPS_BOT_SECRET), keeper du vault
# et de la strategie, sans aucun pouvoir d'admin. Chaque etape tourne meme si
# la precedente echoue, mais le job finit en echec pour qu'on le voie.
#
# Le taux BCE parait vers 16 h CET : 17 h 30 UTC le trouve publie.

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ops-daily
  cancel-in-progress: false

env:
  VAULT: CBESWJ4CXLWEFU33HEEMJFT4SAYV5PW6LPEBAYRQBAPKIGRFSVBWXVOV
  AQUARIUS_STRATEGY: CACZE525I6OY7ASL2UUSHCWY45QA4PXZ3BB3ZEUT6UUUYCFHDVQESEDF
  STELLAR_CLI_VERSION: 27.1.0

jobs:
  ops:
    name: Checkpoint, price, events
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stellar CLI
        run: |
          curl -fsSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin stellar
          stellar --version

      - name: Load keeper key
        env:
          FY_OPS_BOT_SECRET: ${{ secrets.FY_OPS_BOT_SECRET }}
        run: |
          printf '%s' "$FY_OPS_BOT_SECRET" | stellar keys add fy-ops-bot --secret-key > /dev/null
          echo "keeper $(stellar keys address fy-ops-bot)"

      - name: Daily NAV checkpoint
        run: |
          # Un second appel le meme jour UTC est refuse (NavAlreadyPublished,
          # erreur 22) : apres un relancement a la main, ce n'est pas un echec.
          if out=$(stellar contract invoke --id "$VAULT" --source fy-ops-bot --network testnet -- checkpoint 2>&1); then
            echo "$out"
          elif grep -q 'Error(Contract, #22)' <<< "$out"; then
            echo "nav deja publie aujourd'hui"
          else
            echo "$out"
            exit 1
          fi

      - name: Reference price
        if: ${{ !cancelled() }}
        run: scripts/push_reference_price.sh fy-ops-bot "$AQUARIUS_STRATEGY"

      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Ingest events
        if: ${{ !cancelled() }}
        run: |
          git config user.name "foryield-ops-bot"
          git config user.email "ops-bot@users.noreply.github.com"
          # Branche d'archive : creee orpheline au premier passage, sans rien
          # de main. Son historique est le registre en ajout seul.
          if git ls-remote --exit-code --heads origin data/events > /dev/null; then
            git fetch --depth=1 origin data/events
            git worktree add -B data/events archive FETCH_HEAD
          else
            git worktree add --detach archive
            git -C archive switch --orphan data/events
          fi
          (cd web && npm ci && node scripts/ingest-events.mjs ../archive/testnet)
          cd archive
          git add testnet
          if git diff --cached --quiet; then
            echo "aucun nouvel event"
          else
            git commit -q -m "events: ingestion du $(date -u +%F)"
            git push origin data/events
          fi
