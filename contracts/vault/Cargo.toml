[package]
name = "yield-vault"
description = "ForYield Soroban YieldVault: deposit/withdraw, proportional shares, allocation to DeFindex strategies"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
defindex-strategy-core = "0.3.0"
soroban-sdk = "25"

[dev-dependencies]
blend-contract-sdk = { version = "2.25.0", features = ["testutils"] }
proptest = "1"
soroban-sdk = { version = "25", features = ["testutils"] }
